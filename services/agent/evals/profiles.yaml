# 有界审查及无工具、仅源码和无证据验证等对照评测配置。
profiles:
  eval-direct-diff:
    mode: pipeline
    execution: direct
    orchestration: direct-diff
    discovery_mode: direct
    tools: []
  eval-codeguard-full:
    mode: pipeline
    execution: pipeline
    orchestration: change-review
    discovery_mode: controlled
    tools: [read_symbol, query_relations]
    evidence_tools: []
    strict_tools: true
  eval-controlled-codegraph:
    mode: pipeline
    execution: pipeline
    orchestration: change-review
    discovery_mode: controlled
    tools: [read_symbol, query_relations]
    evidence_tools: []
    strict_tools: true
  eval-source-only:
    mode: pipeline
    execution: pipeline
    orchestration: change-review
    discovery_mode: controlled
    tools: [read_symbol]
    evidence_tools: []
    strict_tools: true
  eval-no-evidence:
    mode: pipeline
    execution: pipeline
    orchestration: change-review
    discovery_mode: controlled
    tools: [read_symbol, query_relations]
    evidence_mode: "off"
    strict_tools: true

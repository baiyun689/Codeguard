  - uppercase
  - 大小写
- id: E2
  origin: controlled-seed
  title: 注解查找只比较简单类名
  dimension: logic
  severity: WARNING
  file: src/main/java/com/sun/tools/xjc/addon/xew/CommonUtils.java
  line: 62
  root_cause: 代码模型注解匹配丢弃包名，仅比较 name
  trigger: 模型同时出现来自不同包但同名的注解类型
  observable_consequence: 插件读取或修改错误注解，生成源码的序列化合约被改变
  fix_action: 使用 JClass 完整身份或 fullName 比较注解类型
  call_path:
  - Plugin.run
  - CommonUtils.getAnnotation
  - JAnnotatable.annotations
  primary_risk_tag: API_CONTRACT
  expected_reviewers:
  - behavior
  type_keywords:
  - annotation identity
  - package
  - code generation
- id: E3
  origin: controlled-seed
  title: 不同包的 ObjectFactory 被错误去重
  dimension: quality
  severity: WARNING
  file: src/main/java/com/sun/tools/xjc/addon/xew/Candidate.java
  line: 190
  root_cause: 候选集合用固定简单类名 ObjectFactory 作为全局 key
  trigger: 同一次 XJC 生成包含两个或更多 schema 包
  observable_consequence: 后续包的 factory 被跳过，部分元素声明无法进入生成代码
  fix_action: 以完整限定名或 package identity 作为候选键
  call_path:
  - Plugin.run
  - Candidate.addObjectFactoryForClass
  - objectFactoryClasses
  primary_risk_tag: API_CONTRACT
  expected_reviewers:
  - behavior
  - maintainability
  type_keywords:
  - ObjectFactory
  - package collision
  - code generation

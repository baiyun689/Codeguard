case_id: gitbug-snowflake-credentials
issues:
- id: E1
  origin: upstream-real
  title: credential exposure
  dimension: security
  severity: CRITICAL
  file: src/main/java/net/snowflake/client/jdbc/SnowflakeConnectString.java
  line: 0
  root_cause: Connection URL parse failures include credential properties in the exception
  trigger: 包含凭据的连接 URL 解析失败
  observable_consequence: 异常消息和日志暴露用户名、密码或 token
  fix_action: 在构造异常前按参数语义统一脱敏连接属性
  call_path:
  - SnowflakeDriver.connect
  - SnowflakeConnectString.parse
  - SnowflakeSQLException
  primary_risk_tag: DATA_EXPOSURE
  expected_reviewers:
  - threat_model
  type_keywords:
  - credentials
  - sensitive
  - 凭证
  - 泄漏
- id: E2
  origin: controlled-seed
  title: 混合大小写的敏感参数绕过脱敏
  dimension: security
  severity: CRITICAL
  file: src/main/java/net/snowflake/client/util/SecretDetector.java
  line: 99
  root_cause: 敏感参数判断不再规范化调用方提供的名称
  trigger: 驱动属性使用 Password、Private_Key 等非全小写名称
  observable_consequence: 诊断日志和异常序列化出原始凭据值
  fix_action: 以 Locale.ROOT 规范化名称后再匹配敏感字段集合
  call_path:
  - SnowflakeConnectString
  - SecretDetector.isSensitive
  - maskSecrets
  primary_risk_tag: DATA_EXPOSURE
  expected_reviewers:
  - threat_model
  type_keywords:
  - redaction
  - case normalization
  - credentials
- id: E3
  origin: controlled-seed
  title: 退避时间不再受 cap 约束
  dimension: logic
  severity: WARNING
  file: src/main/java/net/snowflake/client/util/DecorrelatedJitterBackoff.java
  line: 20
  root_cause: 下一次 sleep 直接取指数随机上界而没有应用最大等待时间
  trigger: 连续网络失败使上一次 sleep 多轮增长
  observable_consequence: 重试线程长时间不可用，乘法溢出后还可能抛出参数异常
  fix_action: 在乘法溢出安全的前提下将结果限制到 cap
  call_path:
  - RetryingRestClient
  - DecorrelatedJitterBackoff.nextSleepTime
  - Thread.sleep
  primary_risk_tag: IDEMPOTENCY_RETRY
  expected_reviewers:
  - behavior
  - maintainability
  type_keywords:
  - backoff
  - cap
  - overflow

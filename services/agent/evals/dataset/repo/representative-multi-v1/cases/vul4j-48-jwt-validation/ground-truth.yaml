case_id: vul4j-48-jwt-validation
issues:
- id: E1
  origin: upstream-real
  title: CWE-20 input validation
  dimension: security
  severity: CRITICAL
  file: src/main/java/org/primeframework/jwt/JWTDecoder.java
  line: 0
  root_cause: JWT input is accepted without all required structural validation
  trigger: 提交结构不完整或额外分段的 JWT
  observable_consequence: 无效 token 进入解码和认证流程
  fix_action: 严格验证三段结构、签名存在性和算法约束
  call_path:
  - JWTDecoder.decode
  - getParts
  - Verifier.verify
  primary_risk_tag: INPUT_VALIDATION
  expected_reviewers:
  - threat_model
  - behavior
  type_keywords:
  - input validation
  - JWT
  - 输入校验
  - CWE-20
- id: E2
  origin: controlled-seed
  title: HMAC 校验只比较签名长度
  dimension: security
  severity: CRITICAL
  file: src/main/java/org/primeframework/jwt/hmac/HMACVerifier.java
  line: 78
  root_cause: Verifier 未比较攻击者签名与计算结果的内容
  trigger: 攻击者提交任意与目标算法输出等长的签名
  observable_consequence: 伪造 JWT 被当作已认证 token 接受
  fix_action: 使用 MessageDigest.isEqual 做恒时完整字节比较
  call_path:
  - JWTDecoder.decode
  - HMACVerifier.verify
  - Mac.doFinal
  primary_risk_tag: AUTHENTICATION_SESSION
  expected_reviewers:
  - threat_model
  type_keywords:
  - HMAC
  - signature
  - authentication
- id: E3
  origin: controlled-seed
  title: 自定义 claim 可覆盖 registered claim
  dimension: security
  severity: CRITICAL
  file: src/main/java/org/primeframework/jwt/domain/JWT.java
  line: 261
  root_cause: 序列化末尾重新合并 claims，使 exp、iss、sub 等保留字段可被同名自定义值覆盖
  trigger: 调用方同时设置 typed expiration/issuer 与同名自定义 claim
  observable_consequence: 签发内容与服务端校验、审计所见的主体或期限不一致
  fix_action: 拒绝保留名进入自定义 claims，并确保 typed claims 最后写入
  call_path:
  - JWT.addClaim
  - JWT.getRawClaims
  - JWTEncoder.encode
  primary_risk_tag: API_CONTRACT
  expected_reviewers:
  - threat_model
  - behavior
  type_keywords:
  - claim collision
  - registered claim
  - JWT

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: codeguard-ci
    metrics_path: /metrics
    static_configs:
      - targets: ["codeguard:8080"]

  - job_name: codeguard-tools
    metrics_path: /metrics
    static_configs:
      - targets: ["codeguard:9090"]

  - job_name: codeguard-llm-proxy
    metrics_path: /metrics
    static_configs:
      - targets: ["codeguard:9091"]

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: codeguard
      MYSQL_USER: codeguard
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-codeguard}
    ports:
      - "${MYSQL_HOST_PORT:-3308}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  codeguard:
    image: ghcr.io/baiyun689/codeguard:${CODEGUARD_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: missing
    env_file:
      - .env
    environment:
      CODEGUARD_WEBHOOK_SECRET: ${CODEGUARD_WEBHOOK_SECRET:?set CODEGUARD_WEBHOOK_SECRET in .env}
      CODEGUARD_GITHUB_APP_ID: ${CODEGUARD_GITHUB_APP_ID:?set CODEGUARD_GITHUB_APP_ID in .env}
      CODEGUARD_API_KEY: ${CODEGUARD_API_KEY:?set CODEGUARD_API_KEY in .env}
      CODEGUARD_GITHUB_PRIVATE_KEY_FILE: /run/secrets/github_app_private_key
      CODEGUARD_API_BASE_URL: ${CODEGUARD_API_BASE_URL:-http://localhost:9091/v1}
      CODEGUARD_CI_PORT: "8080"
      CODEGUARD_TOOL_SERVER_URL: http://localhost:9090
      CODEGUARD_TOOL_SERVER_PORT: "9090"
      CODEGUARD_LLM_PROXY_PORT: "9091"
      CODEGUARD_JOB_DB_URL: jdbc:mysql://mysql:3306/codeguard
      CODEGUARD_JOB_DB_USER: codeguard
      CODEGUARD_JOB_DB_PASSWORD: ${MYSQL_PASSWORD:-codeguard}
      CODEGUARD_WORKSPACE_DIR: /tmp/codeguard-jobs
      CODEGUARD_TRACE_DIR: /app/trace
    secrets:
      - github_app_private_key
    ports:
      - "${CODEGUARD_HOST_PORT:-9090}:8080"
      - "127.0.0.1:${CODEGUARD_TOOL_HOST_PORT:-9092}:9090"
    volumes:
      - gateway-data:/app/data
      - job-workspaces:/tmp/codeguard-jobs
      - ./trace:/app/trace
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8080/health/ready >/dev/null && wget -qO- http://localhost:9090/health/ready >/dev/null && wget -qO- http://localhost:9091/health/ready >/dev/null",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_HOST_PORT:-9093}:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      codeguard:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-codeguard}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS_ENABLED:-true}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

secrets:
  github_app_private_key:
    file: ${CODEGUARD_GITHUB_PRIVATE_KEY_FILE:-./secrets/github-app.pem}

volumes:
  mysql-data:
  gateway-data:
  job-workspaces:
  prometheus-data:
  grafana-data:
